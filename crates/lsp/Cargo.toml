[package]
name = "fast-lsp"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
fast-core.workspace = true
lsp-types = "0.95.1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
